        <h1>Generate Strong & Secure Passwords <span>Instantly !</span></h1>
        <h5>Create unique & secure passwords in just one click.</h5>
        <div class="password-card">

            <div class="box">
                <input type="text" id="password" placeholder="Your Generated Password :" readonly>

                <button id="copyBtn" type="button" title="Copy password" aria-label="Copy password">

                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path
                            d="M4 1.5A1.5 1.5 0 0 1 5.5 0h7A1.5 1.5 0 0 1 14 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 11.5zm1.5-.5a.5.5 0 0 0-.5.5v10a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-10a.5.5 0 0 0-.5-.5z" />

                    </svg>

                </button>
            </div>


            <div class="length-container">
                <label>Password Enquaries</label>

                <div class="length-control">
                    <button type="button" id="decrease">−</button>

                    <span id="length-value">16</span>

                    <button type="button" id="increase">+</button>
                </div>
            </div>


            <div class="check">
                <input type="checkbox" name="" id="upper">UpperCase (A-Z)
                <input type="checkbox" name="" id="lower">LowerCase (a-z)
                <input type="checkbox" name="" id="number">Number
                <input type="checkbox" name="" id="symbol">Symbols
            </div>
            <div class="generate">
